<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- TokenTrim Official Squircle App Icon (Concept 1: Precision Shear & Token Reduction) -->
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="sqBg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffdfb"/>
      <stop offset="100%" stop-color="#f6efe6"/>
    </linearGradient>

    <!-- Crimson gradient for upper segment -->
    <linearGradient id="sqCrimson" x1="32" y1="20" x2="96" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cf1726"/>
      <stop offset="60%" stop-color="#b81420"/>
      <stop offset="100%" stop-color="#990e18"/>
    </linearGradient>

    <!-- Obsidian charcoal gradient for lower segment -->
    <linearGradient id="sqInk" x1="40" y1="56" x2="96" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a201b"/>
      <stop offset="100%" stop-color="#17120f"/>
    </linearGradient>

    <!-- Razor blade line gradient -->
    <linearGradient id="sqBladeLine" x1="22" y1="94" x2="106" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c1121f" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#e01a2b"/>
      <stop offset="80%" stop-color="#ff4a5a"/>
      <stop offset="100%" stop-color="#c1121f" stop-opacity="0.15"/>
    </linearGradient>

    <!-- App icon container shadow -->
    <filter id="sqShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3e2a20" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#3e2a20" flood-opacity="0.08"/>
    </filter>

    <filter id="emblemShadow" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#241b16" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#sqBg)" stroke="#e7dccf" stroke-width="1.5" filter="url(#sqShadow)"/>

  <!-- Centered Emblem (Concept 1) -->
  <g transform="translate(64, 64) scale(0.92) translate(-64, -64)" filter="url(#emblemShadow)">
    <!-- UPPER DOCUMENT SEGMENT (Crimson) -->
    <path d="M 46 20 
             L 94 20 
             C 96.2 20 98 21.8 98 24 
             L 98 32 
             L 34 84 
             C 32.8 85 31 84.2 31 82.6 
             L 31 35 
             L 46 20 Z" 
          fill="url(#sqCrimson)" />

    <!-- Top-left folded page corner -->
    <path d="M 31 35 L 46 20 L 46 33 C 46 34.1 45.1 35 44 35 Z" 
          fill="#f7dde0" />

    <!-- Negative Space: 'T' Top Crossbar -->
    <rect x="42" y="44" width="36" height="11" rx="2" fill="#ffffff" />

    <!-- LOWER DOCUMENT SEGMENT (Obsidian Charcoal) -->
    <path d="M 40 94 
             L 98 47 
             L 98 93 
             L 83 108 
             L 36 108 
             C 33.8 108 32 106.2 32 104 
             L 32 100 
             C 32 98.6 33.2 97.4 34.6 96.4 
             L 40 94 Z" 
          fill="url(#sqInk)" />

    <!-- Bottom-right folded page corner -->
    <path d="M 98 93 L 83 108 L 83 95 C 83 93.9 83.9 93 85 93 Z" 
          fill="#f7dde0" />

    <!-- Negative Space: 'T' Stem -->
    <rect x="54" y="60" width="12" height="34" rx="2" fill="#ffffff" />

    <!-- THE PRECISION TRIM CHANNEL & TOKENS -->
    <line x1="22" y1="94" x2="106" y2="34" stroke="url(#sqBladeLine)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="30" y1="88" x2="98" y2="40" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.95" />

    <!-- Token 1 (Crimson) -->
    <rect x="76" y="38" width="8" height="8" rx="1.5" 
          transform="rotate(-36 80 42)" 
          fill="#c1121f" 
          stroke="#ffffff" 
          stroke-width="1.2" />

    <!-- Token 2 (Obsidian) -->
    <rect x="64" y="47" width="8" height="8" rx="1.5" 
          transform="rotate(-36 68 51)" 
          fill="#241b16" 
          stroke="#ffffff" 
          stroke-width="1.2" />
  </g>
</svg>
