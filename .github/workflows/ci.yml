name: TokenTrim CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - run: npm run benchmark
      - run: npm run audit:permissions
      - run: npm run audit:network
      - run: npm run build
