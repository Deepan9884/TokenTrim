name: TokenTrim E2E (Playwright + live Chromium)
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run build
      - run: npm run e2e:fixtures
      - run: pip install pypdf && python tests/e2e/fixtures/generate-password.py
      - run: npx playwright install chromium
      - run: xvfb-run -a npx playwright test --config=tests/e2e/playwright.config.ts
        working-directory: .
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run build
      - run: npm run e2e:fixtures
      - working-directory: admin
        run: npm ci || npm install
      - run: npx playwright install chromium
      - run: xvfb-run -a npx playwright test --config=tests/admin/playwright.config.ts
        working-directory: .
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-report
          path: |
            test-results/
            playwright-report/
