<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- TokenTrim Official Horizontal Lockup (Concept 1: Precision Shear) -->
  <defs>
    <linearGradient id="hlCrimson" x1="16" y1="10" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cf1726"/>
      <stop offset="60%" stop-color="#b81420"/>
      <stop offset="100%" stop-color="#990e18"/>
    </linearGradient>

    <linearGradient id="hlInk" x1="20" y1="28" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a201b"/>
      <stop offset="100%" stop-color="#17120f"/>
    </linearGradient>

    <linearGradient id="hlBladeLine" x1="11" y1="47" x2="53" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c1121f" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#e01a2b"/>
      <stop offset="100%" stop-color="#ff4a5a"/>
    </linearGradient>
  </defs>

  <!-- Scaled Concept 1 Emblem on Left (0 0 64 64) -->
  <g transform="translate(4, 3) scale(0.48)">
    <!-- Upper Crimson Document -->
    <path d="M 46 20 L 94 20 C 96.2 20 98 21.8 98 24 L 98 32 L 34 84 C 32.8 85 31 84.2 31 82.6 L 31 35 L 46 20 Z" 
          fill="url(#hlCrimson)" />

    <!-- Top-left folded page corner -->
    <path d="M 31 35 L 46 20 L 46 33 C 46 34.1 45.1 35 44 35 Z" 
          fill="#f7dde0" />

    <!-- 'T' Top Crossbar -->
    <rect x="42" y="44" width="36" height="11" rx="2" fill="#ffffff" />

    <!-- Lower Obsidian Document -->
    <path d="M 40 94 L 98 47 L 98 93 L 83 108 L 36 108 C 33.8 108 32 106.2 32 104 L 32 100 C 32 98.6 33.2 97.4 34.6 96.4 L 40 94 Z" 
          fill="url(#hlInk)" />

    <!-- Bottom-right fold -->
    <path d="M 98 93 L 83 108 L 83 95 C 83 93.9 83.9 93 85 93 Z" 
          fill="#f7dde0" />

    <!-- 'T' Stem -->
    <rect x="54" y="60" width="12" height="34" rx="2" fill="#ffffff" />

    <!-- Precision Trim Laser & Tokens -->
    <line x1="22" y1="94" x2="106" y2="34" stroke="url(#hlBladeLine)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="30" y1="88" x2="98" y2="40" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.95" />

    <rect x="76" y="38" width="8" height="8" rx="1.5" transform="rotate(-36 80 42)" fill="#c1121f" stroke="#ffffff" stroke-width="1.2" />
    <rect x="64" y="47" width="8" height="8" rx="1.5" transform="rotate(-36 68 51)" fill="#241b16" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- Typography: TokenTrim Wordmark -->
  <g transform="translate(68, 0)">
    <text x="0" y="37" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="-0.5px" 
          fill="#241b16">Token<tspan fill="#c1121f">Trim</tspan></text>

    <!-- Subtitle / Tagline -->
    <text x="1" y="52" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" 
          font-size="9.5" 
          font-weight="600" 
          letter-spacing="2.2px" 
          fill="#8c7e73">AI TOKEN OPTIMIZER</text>

    <!-- Crimson Trim Accent Rule -->
    <rect x="76" y="36" width="32" height="2" rx="1" fill="#c1121f" opacity="0.9"/>
  </g>
</svg>
