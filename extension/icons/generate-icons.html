<!DOCTYPE html>
<html>
<head>
  <title>Generate TokenTrim Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    canvas {
      border: 1px solid #ccc;
      margin: 10px;
    }
    .icon-set {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
    button {
      background: #4648d4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #3538b0;
    }
  </style>
</head>
<body>
  <h1>TokenTrim Icon Generator</h1>
  <p>Click "Generate Icons" to create and download all three icon sizes.</p>
  
  <button onclick="generateAllIcons()">Generate Icons</button>
  
  <div class="icon-set">
    <div>
      <h3>16x16</h3>
      <canvas id="icon16" width="16" height="16"></canvas>
    </div>
    <div>
      <h3>48x48</h3>
      <canvas id="icon48" width="48" height="48"></canvas>
    </div>
    <div>
      <h3>128x128</h3>
      <canvas id="icon128" width="128" height="128"></canvas>
    </div>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#4648d4');
      gradient.addColorStop(1, '#6063ee');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // White document icon
      const padding = size * 0.2;
      const docWidth = size * 0.6;
      const docHeight = size * 0.7;
      const docX = padding;
      const docY = padding;
      
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.moveTo(docX, docY);
      ctx.lineTo(docX + docWidth - padding/2, docY);
      ctx.lineTo(docX + docWidth, docY + padding/2);
      ctx.lineTo(docX + docWidth, docY + docHeight);
      ctx.lineTo(docX, docY + docHeight);
      ctx.closePath();
      ctx.fill();
      
      // Fold
      ctx.fillStyle = '#e1e0ff';
      ctx.beginPath();
      ctx.moveTo(docX + docWidth - padding/2, docY);
      ctx.lineTo(docX + docWidth, docY + padding/2);
      ctx.lineTo(docX + docWidth - padding/2, docY + padding/2);
      ctx.closePath();
      ctx.fill();
      
      // Lines (for larger icons)
      if (size >= 48) {
        ctx.strokeStyle = '#4648d4';
        ctx.lineWidth = size / 32;
        const lineY = docY + docHeight * 0.4;
        const lineSpacing = size / 12;
        
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(docX + padding/2, lineY + i * lineSpacing);
          ctx.lineTo(docX + docWidth - padding, lineY + i * lineSpacing);
          ctx.stroke();
        }
      }
    }

    function downloadCanvas(canvas, filename) {
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    function generateAllIcons() {
      const sizes = [
        { id: 'icon16', size: 16, filename: 'icon16.png' },
        { id: 'icon48', size: 48, filename: 'icon48.png' },
        { id: 'icon128', size: 128, filename: 'icon128.png' }
      ];

      sizes.forEach(({ id, size, filename }) => {
        const canvas = document.getElementById(id);
        drawIcon(canvas, size);
        setTimeout(() => downloadCanvas(canvas, filename), 100);
      });

      alert('Icons generated! Check your downloads folder.');
    }

    // Draw icons on load
    window.onload = () => {
      drawIcon(document.getElementById('icon16'), 16);
      drawIcon(document.getElementById('icon48'), 48);
      drawIcon(document.getElementById('icon128'), 128);
    };
  </script>
</body>
</html>
